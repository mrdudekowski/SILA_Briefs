<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>Бриф на сайт</title>
  <style>
    :root {
      /* Single source of truth для всей визуальной системы */
      --color-bg: #0a0608;
      --color-surface: rgb(14 8 10 / 55%);
      --color-text: #f2f1ec;
      --color-text-muted: #c4bfb8;
      --color-text-faint: #9a948c;
      --color-border: #4a3036;
      --color-divider: rgb(255 255 255 / 14%);
      --color-focus: #f2f1ec;
      --color-error: #e8a8a8;
      --color-success: #8fd4b3;
      --color-progress-bg: rgb(0 0 0 / 35%);
      --color-progress-fill: #f2f1ec;
      --shadow-sm: none;
      --shadow-tooltip: 0 8px 32px rgb(0 0 0 / 45%);
      --radius-sm: 4px;
      --radius-md: 8px;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 2.75rem;
      --space-8: 3.5rem;
      --space-9: 4.25rem;
      --font-family: Inter, "Segoe UI", Roboto, system-ui, sans-serif;
      --font-size-base: 16px;
      --line-height-prose: 1.62;
      --transition-base: 180ms ease;
      --container-max: 42rem;
      --shell-pad-inline: clamp(1rem, 4vw, 2rem);
      --shell-pad-block: clamp(1.25rem, 3vw, 2rem);
      --input-border: 1px solid rgba(255, 255, 255, 0.18);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      min-height: -webkit-fill-available;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: #050304;
      background-image: linear-gradient(
        128deg,
        #050505 0%,
        #0c0608 22%,
        #14070c 42%,
        #1f0810 58%,
        #2c0a14 74%,
        #3a0e18 88%,
        #48121c 100%
      );
      background-attachment: scroll;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      min-height: -webkit-fill-available;
    }

    body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      line-height: var(--line-height-prose);
      color: var(--color-text);
      background: transparent;
      padding: 0;
    }

    .wizard-shell {
      max-width: calc(var(--container-max) + 2 * var(--shell-pad-inline));
      margin: 0 auto;
      padding: calc(var(--shell-pad-block) + env(safe-area-inset-top, 0px)) calc(var(--shell-pad-inline) + env(safe-area-inset-right, 0px)) calc(var(--shell-pad-block) + var(--space-3)) calc(var(--shell-pad-inline) + env(safe-area-inset-left, 0px));
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    .wizard-masthead {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 0 var(--space-5);
      border-bottom: 1px solid var(--color-divider);
    }

    .wizard-header {
      max-width: var(--container-max);
      margin-left: auto;
      margin-right: auto;
      padding: 0 0 var(--space-4);
      border-bottom: none;
    }

    .wizard-shell:not(:has(.wizard-masthead)) > .wizard-header {
      padding-bottom: var(--space-5);
      border-bottom: 1px solid var(--color-divider);
    }

    .wizard-title {
      margin: 0 0 var(--space-3);
      font-size: clamp(1.5rem, 2.6vw, 1.9rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .wizard-subtitle {
      margin: 0;
      color: var(--color-text-muted);
      font-size: 0.9375rem;
      line-height: var(--line-height-prose);
      max-width: 48ch;
    }

    .progress-wrap {
      padding: var(--space-4) 0 0;
      border-bottom: none;
    }

    .progress-label {
      margin-bottom: var(--space-3);
      color: var(--color-text-faint);
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      text-transform: none;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .progress-bar {
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: var(--color-progress-bg);
      overflow: hidden;
    }

    .progress-value {
      height: 100%;
      width: 0%;
      background: var(--color-progress-fill);
      transition: width var(--transition-base);
    }

    .wizard-content {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-9) 0 var(--space-7);
      min-height: 360px;
      min-width: 0;
      animation: fadeIn var(--transition-base);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .step-title {
      margin-top: 0;
      margin-bottom: var(--space-3);
      font-size: clamp(1.22rem, 2.1vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.028em;
      line-height: 1.18;
      color: var(--color-text);
    }

    .step-description {
      margin-top: 0;
      margin-bottom: var(--space-8);
      color: var(--color-text-muted);
      font-size: 0.9375rem;
      line-height: var(--line-height-prose);
      max-width: 48ch;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-7);
    }

    @media (min-width: 720px) {
      .form-grid--two {
        grid-template-columns: 1fr 1fr;
      }
    }

    .brief-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }

    .brief-section {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: var(--space-7) 0 0;
      margin: 0;
      border-top: 1px solid var(--color-divider);
    }

    .brief-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    .brief-section__title {
      margin: 0 0 var(--space-3);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--color-text-faint);
    }

    .brief-section__intro {
      margin: 0 0 var(--space-6);
      color: var(--color-text-muted);
      font-size: 0.9375rem;
      line-height: var(--line-height-prose);
      max-width: 48ch;
    }

    .brief-grid {
      display: grid;
      gap: var(--space-7);
      grid-template-columns: 1fr;
      min-width: 0;
    }

    @media (min-width: 640px) {
      .brief-grid--2 {
        grid-template-columns: 1fr 1fr;
      }

      .brief-grid--3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    @media (min-width: 640px) and (max-width: 959px) {
      .brief-grid--3 {
        grid-template-columns: 1fr 1fr;
      }
    }

    .brief-block--full {
      grid-column: 1 / -1;
    }

    .brief-block {
      min-width: 0;
      max-width: 100%;
    }

    .brief-field-cluster {
      border: none;
      border-radius: 0;
      padding: 0;
      margin: 0 0 var(--space-7);
      background: transparent;
      box-shadow: none;
    }

    .brief-field-cluster:last-child {
      margin-bottom: 0;
    }

    .brief-field-cluster .brief-grid + .brief-grid {
      margin-top: var(--space-6);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-divider);
    }

    .brief-field-cluster__intro {
      margin: 0 0 var(--space-3);
      font-size: 0.75rem;
      line-height: 1.55;
      color: var(--color-text-faint);
      max-width: 56ch;
      font-weight: 400;
    }

    .brief-field-cluster__headline {
      margin: 0 0 var(--space-3);
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--color-text-faint);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brief-field-cluster__intro + .brief-field-cluster__headline {
      margin-top: var(--space-1);
    }

    .brief-field-cluster__headline-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-2);
      margin: 0 0 var(--space-3);
    }

    .brief-field-cluster__headline-row .brief-field-cluster__headline {
      margin: 0;
    }

    .choice-group--tiles {
      gap: var(--space-2);
    }

    .choice-group__legend-sub {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: var(--space-2);
      padding: 0;
    }

    .choice-tiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 4.75rem));
      gap: var(--space-2);
      justify-content: start;
    }

    .square-check {
      position: relative;
      display: block;
      cursor: pointer;
      margin: 0;
    }

    .square-check__input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      pointer-events: none;
    }

    .square-check__face {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      width: 100%;
      max-width: 4.75rem;
      padding: var(--space-1) var(--space-2);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.15;
      border: 1px solid var(--color-divider);
      border-radius: var(--radius-sm);
      background: rgba(242, 241, 236, 0.04);
      transition: border-color var(--transition-base), background var(--transition-base), color var(--transition-base);
    }

    .square-check:hover .square-check__face {
      border-color: rgba(196, 191, 184, 0.45);
    }

    .square-check__input:checked + .square-check__face {
      border-color: var(--color-text);
      background: transparent;
      color: var(--color-text);
    }

    .square-check__input:focus-visible + .square-check__face {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    .summary-section-title {
      margin: var(--space-7) 0 var(--space-3);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-faint);
    }

    .summary-section-title:first-child {
      margin-top: 0;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      position: relative;
    }

    .field:has(.error-text:not(:empty)) input,
    .field:has(.error-text:not(:empty)) select {
      border-bottom-color: var(--color-error);
      box-shadow: 0 1px 0 0 var(--color-error);
    }

    .field:has(.error-text:not(:empty)) textarea {
      border-color: var(--color-error);
      box-shadow: none;
    }

    .field-label {
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.875rem;
      letter-spacing: 0.01em;
      color: var(--color-text);
    }

    .field-required {
      color: var(--color-error);
      font-weight: 500;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="url"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0;
      border: none;
      border-bottom: var(--input-border);
      border-radius: 0;
      background: transparent;
      color: var(--color-text);
      font: inherit;
      font-size: 1rem;
      line-height: 1.5;
      transition: border-color var(--transition-base), box-shadow var(--transition-base);
    }

    select {
      padding-right: var(--space-5);
      cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--color-text-faint) 50%), linear-gradient(135deg, var(--color-text-faint) 50%, transparent 50%);
      background-position: calc(100% - 0.65rem) 50%, calc(100% - 0.35rem) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      -webkit-appearance: none;
      appearance: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      padding: var(--space-3) 0;
      border: var(--input-border);
      border-radius: var(--radius-sm);
      background: rgba(242, 241, 236, 0.04);
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    input:focus-visible:not(textarea),
    select:focus-visible {
      outline: none;
      border-bottom-color: var(--color-text);
      box-shadow: 0 1px 0 0 var(--color-text);
    }

    textarea:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
      border-color: transparent;
      box-shadow: none;
    }

    .help-text {
      margin: var(--space-2) 0 0;
      font-size: 0.75rem;
      line-height: 1.55;
      color: var(--color-text-faint);
      max-width: 58ch;
      font-weight: 400;
    }

    .error-text {
      margin: var(--space-2) 0 0;
      font-size: 0.75rem;
      line-height: 1.5;
      color: var(--color-error);
      min-height: 1.1em;
      font-weight: 500;
    }

    .field:has(.error-text:not(:empty)),
    fieldset.field.choice-group:has(.error-text:not(:empty)) {
      padding-left: 0;
      margin-left: 0;
      border-left: none;
    }

    fieldset.choice-group:has(.error-text:not(:empty)):not(.field) {
      box-shadow: none;
    }

    fieldset.choice-group:has(.error-text:not(:empty)) > legend {
      border-bottom-color: rgba(232, 168, 168, 0.45);
    }

    fieldset.choice-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      border: none;
      border-radius: 0;
      padding: 0;
      margin: 0;
      min-width: 0;
      min-inline-size: 0;
      max-width: 100%;
      background: transparent;
    }

    fieldset.choice-group > legend {
      display: block;
      float: none;
      padding: 0 0 var(--space-3);
      margin: 0 0 var(--space-4);
      border-bottom: 1px solid var(--color-divider);
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    fieldset.choice-group > .help-text {
      padding: 0;
      margin-top: 0;
      margin-bottom: var(--space-3);
    }

    fieldset.choice-group > .error-text {
      margin: var(--space-3) 0 0;
    }

    .choice-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      margin: 0;
      padding: 0;
    }

    .choice-card {
      border: none;
      border-radius: 0;
      border-top: none;
      background: transparent;
      padding: var(--space-4) 0;
      display: flex;
      gap: var(--space-3);
      align-items: flex-start;
      cursor: pointer;
      transition: color var(--transition-base);
    }

    fieldset.choice-group > .choice-card ~ .choice-card {
      border-top: 1px solid var(--color-divider);
    }

    .choice-card:hover {
      background: transparent;
    }

    .choice-card:hover .choice-card__title {
      color: var(--color-text);
    }

    .choice-card input {
      margin-top: 0.2rem;
    }

    .choice-card__title {
      font-weight: 500;
      margin-bottom: var(--space-1);
      font-size: 0.9375rem;
      color: var(--color-text);
      transition: color var(--transition-base);
    }

    .choice-card__desc {
      margin: 0;
      color: var(--color-text-muted);
      font-size: 0.8125rem;
      line-height: var(--line-height-prose);
      max-width: 60ch;
    }

    .tag-note {
      display: inline;
      border: none;
      border-radius: 0;
      font-size: inherit;
      padding: 0;
      color: inherit;
    }

    .option-hints {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2) var(--space-5);
      margin-top: var(--space-3);
      padding-top: 0;
      border-top: none;
    }

    .option-hint-item {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.75rem;
      color: var(--color-text-faint);
    }

    .wizard-footer {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-6) 0 calc(var(--space-3) + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--color-divider);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0;
      padding: 0.55rem 0;
      min-width: 6.5rem;
      min-height: 2.75rem;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background: transparent;
      color: var(--color-text-muted);
      transition: color var(--transition-base), border-color var(--transition-base), opacity var(--transition-base);
    }

    .btn:hover:not(:disabled) {
      color: var(--color-text);
      border-bottom-color: var(--color-text);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      -webkit-appearance: none;
      appearance: none;
      background-color: #f2f1ec;
      color: #0a0608;
      background-color: var(--color-text);
      color: var(--color-bg);
      border: 1px solid #f2f1ec;
      border-color: var(--color-text);
      border-radius: var(--radius-sm);
      padding: 0.65rem 1.25rem;
      min-width: 6.5rem;
      min-height: 2.75rem;
      font-weight: 500;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    @media (forced-colors: active) {
      .btn-primary {
        forced-color-adjust: none;
        color: CanvasText;
        background: ButtonFace;
        border-color: ButtonBorder;
      }
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.06);
      border-bottom-color: var(--color-text);
    }

    .step-counter {
      color: var(--color-text-faint);
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      text-transform: none;
      font-weight: 500;
      align-self: center;
    }

    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: var(--container-max);
    }

    .summary-save-reminder {
      margin-top: var(--space-7);
      margin-bottom: var(--space-4);
      max-width: 52ch;
    }

    .summary-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-5);
      max-width: var(--container-max);
    }

    .submission-status {
      margin: var(--space-4) 0 0;
      max-width: 52ch;
      color: var(--color-text-muted);
      font-size: 0.9375rem;
      line-height: var(--line-height-prose);
      white-space: pre-wrap;
    }

    .submission-status--success {
      color: var(--color-success);
    }

    .submission-status--error {
      color: var(--color-error);
    }

    .summary-item {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: var(--space-5) 0;
      border-bottom: 1px solid var(--color-divider);
    }

    .summary-item:first-child {
      padding-top: 0;
    }

    .summary-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .summary-item h3,
    .summary-item h4 {
      margin: 0 0 var(--space-2);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-faint);
    }

    .summary-item p {
      margin: 0 0 var(--space-2);
      color: var(--color-text);
      font-size: 0.9375rem;
      line-height: var(--line-height-prose);
      white-space: pre-wrap;
    }

    .summary-item p:last-child {
      margin-bottom: 0;
    }

    .tooltip-trigger {
      width: auto;
      min-width: 1rem;
      height: auto;
      padding: 0 0.15rem;
      border-radius: 0;
      border: none;
      border-bottom: 1px dotted rgba(154, 148, 140, 0.55);
      background: transparent;
      color: var(--color-text-faint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      line-height: 1.2;
      cursor: help;
      flex-shrink: 0;
      vertical-align: super;
    }

    .tooltip-bubble {
      position: absolute;
      z-index: 10;
      max-width: 320px;
      max-width: min(320px, 90vw);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-divider);
      background: #141012;
      color: var(--color-text);
      box-shadow: var(--shadow-tooltip);
      font-size: 0.75rem;
      line-height: 1.5;
      pointer-events: none;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity var(--transition-base), transform var(--transition-base);
    }

    .tooltip-bubble.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <noscript>
    <p style="margin:1rem;padding:1rem;font-family:system-ui,sans-serif;">
      Для заполнения брифа нужен включённый JavaScript. Откройте файл в обычном браузере или включите скрипты в настройках.

      const getCurrentIndex = () => currentStepIndex;
      const getTotalSteps = () => stepSequence.length;

      const updateField = (group, name, value) => {
        if (group === "details") {
          data.details[name] = value;
          return;
        }
        data[group][name] = value;
      };

      const goNext = () => {
        if (currentStepIndex < stepSequence.length - 1) {
          currentStepIndex += 1;
        }
      };

      const goPrev = () => {
        if (currentStepIndex > 0) {
          currentStepIndex -= 1;
        }
      };

      return {
        getData,
        getCurrentStep,
        getCurrentIndex,
        getTotalSteps,
        updateField,
        goNext,
        goPrev

    })();

    const validationModule = (() => {

      const urlPattern = /^https?:\/\/[^\s/$.?#].[^\s]*$/i;

      const validateContacts = (contacts) => {
        const errors = {};

          return stepErrors;
        }

            if (field.type === "url" && details[field.name] && !urlPattern.test(String(details[field.name]).trim())) {

            }
            return;
          }

          const value = details[field.name];

            if (!Array.isArray(value) || value.length === 0) {
              stepErrors[field.name] = "Выберите хотя бы один вариант.";

    /**
     * Модуль tooltip на базе data-tooltip. Hover/focus на десктопе;
     * на касании: подсказка закрывается по нажатию вне триггера (pointer/touch).
     */
    const tooltipModule = (() => {
      let activeBubble = null;
      let activeTrigger = null;

      const hideTooltip = () => {
        if (!activeBubble) {
          return;
        }
        const bubble = activeBubble;
        const trigger = activeTrigger;
        activeBubble = null;
        activeTrigger = null;
        bubble.classList.remove("is-visible");
        if (trigger && document.activeElement === trigger) {
          trigger.blur();
        }
        setTimeout(() => {
          bubble.remove();
        }, 120);
      };

      const showTooltip = (triggerElement) => {
        const message = triggerElement.getAttribute("data-tooltip");
        if (!message) {
          return;
        }

        hideTooltip();
        const bubble = document.createElement("div");
        bubble.className = "tooltip-bubble";
        bubble.textContent = message;
        document.body.appendChild(bubble);

        const bounds = triggerElement.getBoundingClientRect();
        const top = window.scrollY + bounds.top - bubble.offsetHeight - 8;
        const left = window.scrollX + Math.max(10, bounds.left - 10);
        bubble.style.top = `${Math.max(8, top)}px`;
        bubble.style.left = `${left}px`;

        requestAnimationFrame(() => bubble.classList.add("is-visible"));
        activeBubble = bubble;
        activeTrigger = triggerElement;
      };

      const bindEvents = () => {
        document.addEventListener("mouseover", (event) => {
          const target = event.target.closest("[data-tooltip]");
          if (target) {
            showTooltip(target);
          }
        });

        document.addEventListener("focusin", (event) => {
          const target = event.target.closest("[data-tooltip]");
          if (target) {
            showTooltip(target);
          }
        });

        document.addEventListener("mouseout", (event) => {
          if (event.target.closest("[data-tooltip]")) {
            hideTooltip();
          }
        });

        document.addEventListener("focusout", (event) => {
          if (event.target.closest("[data-tooltip]")) {
            hideTooltip();
          }
        });

        const dismissHintOnTouchOutside = (event) => {
          if (!activeBubble || !activeTrigger) {
            return;
          }
          let target = null;
          if (event.type === "pointerdown" && window.PointerEvent) {
            if (event.pointerType !== "touch" && event.pointerType !== "pen") {
              return;
            }
            target = event.target;
          } else if (event.type === "touchstart") {
            const touch = event.touches && event.touches[0];
            if (!touch) {
              return;
            }
            target = document.elementFromPoint(touch.clientX, touch.clientY);
          } else {
            return;
          }
          if (!target || activeTrigger.contains(target)) {
            return;
          }
          hideTooltip();
        };

        document.addEventListener("pointerdown", dismissHintOnTouchOutside, true);
        document.addEventListener("touchstart", dismissHintOnTouchOutside, { capture: true, passive: true });
      };

      return { bindEvents };
    })();

    const exportModule = (() => {

        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

      const normalizeOutputText = (value) => {
        if (Array.isArray(value)) {
          return value.length ? value.join(", ") : "—";
        }
        if (value === null || value === undefined || String(value).trim() === "") {
          return "—";
        }
        return String(value).trim();
      };

      const sanitizeFilenamePart = (value) => String(value || "")
        .replace(/[\\/:*?"<>|]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      const makeDateSuffix = () => {
        const date = new Date();
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const yy = String(date.getFullYear()).slice(-2);
        return `${mm}.${yy}`;
      };

      const buildFileName = (state) => {
        const company = sanitizeFilenamePart(state.contacts.companyName) || "БезКомпании";
        const categoryLabel = sanitizeFilenamePart(categorySchemaModule.categoryLabelByValue[state.category]) || "БезКатегории";
        return `Бриф ${company} ${categoryLabel} ${makeDateSuffix()}.html`;
      };

      const readWizardStylesFromDocument = () => {
        try {
          const tag = document.querySelector("head > style");
          return tag && tag.textContent ? tag.textContent : "";
        } catch {
          return "";
        }
      };

      const reportExportAppendixCss = `
.report-export-shell .report-export-body { padding-bottom: var(--space-8); }
.report-export-body > .report-section ~ .report-section {
  margin-top: var(--space-6);
  padding-top: var(--space-6);
  border-top: 1px solid var(--color-divider);
}
.report-export-body .report-subheading {
  margin: var(--space-5) 0 var(--space-3);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-faint);
}
.report-export-body .report-section .report-subheading:first-child {
  margin-top: 0;
}
.report-export-body .report-table {
  width: 100%;
  border-collapse: collapse;
}
.report-export-body .report-table th,
.report-export-body .report-table td {
  padding: var(--space-3) 0;
  border: none;
  border-bottom: 1px solid var(--color-divider);
  vertical-align: top;
  text-align: left;
}
.report-export-body .report-table th {
  width: 36%;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-faint);
  padding-right: var(--space-4);
}
.report-export-body .report-table td {
  font-size: 0.9375rem;
  color: var(--color-text);
  line-height: var(--line-height-prose);
  white-space: pre-wrap;
}
.report-export-body .report-table tr:last-child th,
.report-export-body .report-table tr:last-child td {
  border-bottom: none;
}
.report-export-body .report-meta {
  margin-top: var(--space-6);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-divider);
  font-size: 0.8125rem;
  color: var(--color-text-faint);
}
.report-export-body .report-section .report-section--nested {
  margin-top: var(--space-4);
}
.report-export-body .report-section .report-section--nested + .report-section--nested {
  margin-top: var(--space-5);
  padding-top: var(--space-5);
  border-top: 1px solid var(--color-divider);
}
`;

      const buildStaticReport = (state) => {
        const wizardCss = readWizardStylesFromDocument();
        const categoryMeta =
          state.category === "website"
            ? { sections: categorySchemaModule.getMergedWebsiteBriefSections() }
            : categorySchemaModule.categoryDetails[state.category];
        const detailSectionsHtml = (() => {
          if (!categoryMeta) {
            return "";
          }
          if (Array.isArray(categoryMeta.sections)) {
            return categoryMeta.sections.map((section) => {
              const rows = section.blocks
                .flatMap((block) => block.fields)
                .map((field) => {
                  const value = normalizeOutputText(state.details[field.name]);
                  return `<tr><th>${escapeHtml(field.label)}</th><td>${escapeHtml(value)}</td></tr>`;
                })
                .join("");
              return `<section class="report-section report-section--nested"><h3 class="report-subheading">${escapeHtml(section.title)}</h3><table class="report-table">${rows}</table></section>`;
            }).join("");
          }
          const flatFields =
            state.category === "website"
              ? categorySchemaModule.websiteWizardStepKeys.flatMap((key) => categorySchemaModule.getFlatFields(key))
              : categorySchemaModule.getFlatFields(state.category);
          const rows = flatFields.map((field) => {
            const value = normalizeOutputText(state.details[field.name]);
            return `<tr><th>${escapeHtml(field.label)}</th><td>${escapeHtml(value)}</td></tr>`;
          }).join("");
          return `<table class="report-table">${rows}</table>`;
        })();

        return `<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отчет по брифу</title>
  <style>
${wizardCss}
${reportExportAppendixCss}
  </style>
</head>
<body>
  <main class="wizard-shell report-export-shell">
    <header class="wizard-header">
      <h1 class="wizard-title">Бриф на сайт</h1>
    </header>
    <div class="wizard-content report-export-body">
      <section class="report-section">
        <h2 class="step-title">Контакты</h2>
        <table class="report-table">
          <tr><th>Имя</th><td>${escapeHtml(normalizeOutputText(state.contacts.clientName))}</td></tr>
          <tr><th>Компания</th><td>${escapeHtml(normalizeOutputText(state.contacts.companyName))}</td></tr>
          <tr><th>Телефон</th><td>${escapeHtml(normalizeOutputText(state.contacts.phone))}</td></tr>
          <tr><th>Email</th><td>${escapeHtml(normalizeOutputText(state.contacts.email))}</td></tr>
        </table>
      </section>
      <section class="report-section">
        <h2 class="step-title">Сайт</h2>
        <p class="wizard-subtitle">${escapeHtml(categorySchemaModule.categoryLabelByValue[state.category] || "—")}</p>
      </section>
      <section class="report-section">
        <h2 class="step-title">Вопросы по проекту</h2>
        ${detailSectionsHtml}
      </section>
      <p class="step-description summary-save-reminder">
        ${escapeHtml("Бриф отправлен автоматически. После обработки брифа мы отправим вам коммерческое предложение, в котором вы детально сможете рассмотреть смету по работе, начинку сайта и прочие детали разработки сайта.")}
      </p>
      <p class="report-meta">Дата формирования: ${escapeHtml(new Date().toLocaleString("ru-RU"))}</p>
    </div>
  </main>
</body>
</html>`;
      };

      const saveReport = (state) => {
        const reportMarkup = buildStaticReport(state);
        const blob = new Blob([reportMarkup], { type: "text/html;charset=utf-8" });
        const fileName = buildFileName(state);
        const url = URL.createObjectURL(blob);

        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      };

      return { buildFileName, buildStaticReport, saveReport, normalizeOutputText, escapeHtml };
    })();

    const briefDeliveryModule = (() => {
      const makeSubmissionSections = (state) => {
        const sections = state.category === "website"
          ? categorySchemaModule.getMergedWebsiteBriefSections()
          : [];

        return sections.map((section) => ({
          id: section.id,
          title: section.title,
          fields: section.blocks
            .flatMap((block) => block.fields)
            .map((field) => ({
              name: field.name,
              label: field.label,
              value: state.details[field.name] || "",
              displayValue: exportModule.normalizeOutputText(state.details[field.name])
            }))
        }));
      };

      const buildSubmissionPayload = (state) => ({
        submittedAt: new Date().toISOString(),
        source: {
          title: document.title,
          url: window.location.href
        },
        category: {
          value: state.category,
          label: categorySchemaModule.categoryLabelByValue[state.category] || state.category
        },
        contacts: {
          clientName: String(state.contacts.clientName || "").trim(),
          companyName: String(state.contacts.companyName || "").trim(),
          phone: String(state.contacts.phone || "").trim(),
          email: String(state.contacts.email || "").trim()
        },
        sections: makeSubmissionSections(state),
        report: {
          fileName: exportModule.buildFileName(state),
          html: exportModule.buildStaticReport(state)
        }
      });

      const sendBrief = async (state) => {
        const endpointUrl = String(briefDeliverySettings.endpointUrl || "").trim();
        if (!endpointUrl) {
          throw new Error("Отправка пока не настроена: владелец должен указать endpointUrl в настройках брифа.");
        }

        const response = await fetch(endpointUrl, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(buildSubmissionPayload(state))
        });

        if (!response.ok) {
          throw new Error("Сервер отправки временно недоступен. Попробуйте ещё раз или сохраните копию брифа.");
        }

        const result = await response.json().catch(() => ({}));
        if (result && result.ok === false) {
          throw new Error(result.message || "Не удалось отправить бриф. Попробуйте ещё раз.");
        }

        return result;
      };

      return { sendBrief };
    })();

    /**
     * Рендер и навигация wizard.
     */
    const wizardNavigationModule = (() => {
      const wizardContentElement = document.getElementById("wizardContent");
      const nextButton = document.getElementById("nextButton");
      const prevButton = document.getElementById("prevButton");
      const stepCounterElement = document.getElementById("stepCounter");
      const progressTextElement = document.getElementById("progressText");
      const progressPercentElement = document.getElementById("progressPercent");
      const progressValueElement = document.getElementById("progressValue");
      const progressBarElement = document.querySelector(".progress-bar");

      let errors = {};

      const writeError = (fieldName, message) => {
        const errorElement = wizardContentElement.querySelector(`[data-error-for="${fieldName}"]`);
        if (errorElement) {
          errorElement.textContent = message || "";
        }
      };

      const clearErrors = () => {
        errors = {};
        wizardContentElement.querySelectorAll("[data-error-for]").forEach((node) => {
          node.textContent = "";
        });
      };

      const createTooltipButton = (tooltipText) => {
        if (!tooltipText) {
          return "";
        }
        const safe = exportModule.escapeHtml(String(tooltipText));
        return `<button class="tooltip-trigger" type="button" aria-label="Подсказка" data-tooltip="${safe}">?</button>`;
      };

      const createFieldHtml = (field) => {
        const requiredMark = field.required ? '<span class="field-required" aria-hidden="true">*</span>' : "";
        const tooltip = createTooltipButton(field.tooltip || "");
        const helpText = field.help ? `<p class="help-text">${field.help}</p>` : "";
        const normalizeOption = (option) => {
          if (typeof option === "string") {
            return { value: option, hint: "" };
          }
          return { value: option.value, hint: option.hint || "" };
        };
        const renderOptionTitle = (optionValue, optionHint) => {
          const optionTooltip = optionHint ? createTooltipButton(optionHint) : "";
          return `<span class="choice-card__title">${optionValue} ${optionTooltip}</span>`;
        };

        if (field.type === "textarea") {
          return `
            <div class="field">
              <label class="field-label" for="${field.name}">${field.label} ${requiredMark} ${tooltip}</label>
              <textarea id="${field.name}" name="${field.name}" placeholder="${field.placeholder || ""}"></textarea>
              ${helpText}
              <p class="error-text" aria-live="polite" data-error-for="${field.name}"></p>
            </div>`;
        }

        if (field.type === "select") {
          const optionItems = field.options.map((option) => normalizeOption(option));
          const hintedOptions = optionItems.filter((option) => option.hint);
          const optionHintsHtml = hintedOptions.length
            ? `<div class="option-hints">${hintedOptions.map((option) => `
                <span class="option-hint-item tag-note">${option.value} ${createTooltipButton(option.hint)}</span>
              `).join("")}</div>`
            : "";
          return `
            <div class="field">
              <label class="field-label" for="${field.name}">${field.label} ${requiredMark} ${tooltip}</label>
              <select id="${field.name}" name="${field.name}">
                <option value="">Выберите вариант</option>
                ${optionItems.map((option) => `<option value="${option.value}" title="${option.hint || ""}">${option.value}</option>`).join("")}
              </select>
              ${optionHintsHtml}
              ${helpText}
              <p class="error-text" aria-live="polite" data-error-for="${field.name}"></p>
            </div>`;
        }

        if (field.type === "checkbox" && field.choiceLayout === "tiles") {
          const optionItems = field.options.map((option) => normalizeOption(option));
          return `
            <fieldset class="field choice-group choice-group--tiles">
              <legend class="choice-group__legend-sub">${field.label} ${requiredMark} ${tooltip}</legend>
              <div class="choice-tiles">
                ${optionItems.map((option) => `
                  <label class="square-check">
                    <input class="square-check__input" type="checkbox" name="${field.name}" value="${option.value}">
                    <span class="square-check__face">${option.value}</span>
                  </label>
                `).join("")}
              </div>
              ${helpText}
              <p class="error-text" aria-live="polite" data-error-for="${field.name}"></p>
            </fieldset>`;
        }

        if (field.type === "radio" || field.type === "checkbox") {
          const optionItems = field.options.map((option) => normalizeOption(option));
          return `
            <fieldset class="field choice-group">
              <legend class="field-label">${field.label} ${requiredMark} ${tooltip}</legend>
              ${optionItems.map((option, index) => `
                <label class="choice-card">
                  <input type="${field.type}" name="${field.name}" value="${option.value}" ${field.type === "radio" && index === 0 ? "" : ""}>
                  <span>
                    ${renderOptionTitle(option.value, option.hint)}
                  </span>
                </label>
              `).join("")}
              ${helpText}
              <p class="error-text" aria-live="polite" data-error-for="${field.name}"></p>
            </fieldset>`;
        }

        return `
          <div class="field">
            <label class="field-label" for="${field.name}">${field.label} ${requiredMark} ${tooltip}</label>
            <input
              id="${field.name}"
              name="${field.name}"
              type="${field.type}"
              placeholder="${field.placeholder || ""}"
              ${field.min ? `min="${field.min}"` : ""}
            >
            ${helpText}
            <p class="error-text" aria-live="polite" data-error-for="${field.name}"></p>
          </div>`;
      };

      const fillFieldsFromState = () => {
        const state = stateStore.getData();
        const stepKey = stateStore.getCurrentStep();

        if (stepKey === "contacts") {
          Object.entries(state.contacts).forEach(([name, value]) => {
            const field = wizardContentElement.querySelector(`[name="${name}"]`);
            if (field) field.value = value;
          });
          return;
        }

        if (categorySchemaModule.categoryDetails[stepKey]) {
          categorySchemaModule.getFlatFields(stepKey).forEach((fieldConfig) => {
            const value = state.details[fieldConfig.name];
            if (fieldConfig.type === "checkbox") {
              const values = Array.isArray(value) ? value : [];
              values.forEach((entry) => {
                const checkbox = wizardContentElement.querySelector(`[name="${fieldConfig.name}"][value="${entry}"]`);
                if (checkbox) checkbox.checked = true;
              });
              return;
            }
            if (fieldConfig.type === "radio") {
              const radio = wizardContentElement.querySelector(`[name="${fieldConfig.name}"][value="${value}"]`);
              if (radio) radio.checked = true;
              return;
            }
            const input = wizardContentElement.querySelector(`[name="${fieldConfig.name}"]`);
            if (input && value !== undefined) input.value = value;
          });
        }
      };

      const renderContactsStep = () => {
        wizardContentElement.innerHTML = `
          <h2 class="step-title">Шаг 1. Как с вами связаться</h2>
          <p class="step-description">
            Контакты нужны, чтобы согласовать детали и сроки по сайту; имя и компания помогают не путать проекты между собой.
          </p>
          <form class="form-grid form-grid--two" novalidate>
            <div class="field">
              <label class="field-label" for="clientName">Имя</label>
              <input id="clientName" name="clientName" type="text" placeholder="Как к вам обращаться">
              <p class="error-text" data-error-for="clientName"></p>
            </div>
            <div class="field">
              <label class="field-label" for="companyName">Название компании</label>
              <input id="companyName" name="companyName" type="text" placeholder="ООО Пример">
              <p class="error-text" data-error-for="companyName"></p>
            </div>
            <div class="field">
              <label class="field-label" for="phone">Телефон</label>
              <input id="phone" name="phone" type="tel" placeholder="+7 (999) 000-00-00">
              <p class="help-text">Формат номера любой; важно, чтобы по нему реально дозвонились до ответственного.</p>
              <p class="error-text" aria-live="polite" data-error-for="phone"></p>
            </div>
            <div class="field">
              <label class="field-label" for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="name@company.com">
              <p class="help-text">Удобно для черновиков и файлов; если не хотите вести переписку по почте — оставьте пустым.</p>
              <p class="error-text" aria-live="polite" data-error-for="email"></p>
            </div>
          </form>`;
      };

      const renderDetailStep = (categoryKey) => {
        const config = categorySchemaModule.categoryDetails[categoryKey];
        if (!config) {
          wizardContentElement.innerHTML = "<p>Не удалось загрузить шаг категории.</p>";
          return;
        }

        const stepDescriptionHtml = config.description
          ? `<p class="step-description">${exportModule.escapeHtml(config.description)}</p>`
          : "";

        if (Array.isArray(config.sections)) {
          const renderSectionBlocks = (blocks) => {
            const pieces = [];
            let i = 0;
            while (i < blocks.length) {
              const block = blocks[i];
              if (block.cluster) {
                const clusterId = block.cluster;
                const grouped = [];
                while (i < blocks.length && blocks[i].cluster === clusterId) {
                  grouped.push(blocks[i]);
                  i++;
                }
                const clusterBody = grouped.map((b) => {
                  const introHtml = b.clusterIntro ? `<p class="brief-field-cluster__intro">${exportModule.escapeHtml(b.clusterIntro)}</p>` : "";
                  let headlineHtml = "";
                  if (b.clusterHeadline && b.clusterHeadlineTooltip) {
                    headlineHtml = `<div class="brief-field-cluster__headline-row">${createTooltipButton(b.clusterHeadlineTooltip)}<p class="brief-field-cluster__headline">${exportModule.escapeHtml(b.clusterHeadline)}</p></div>`;
                  } else if (b.clusterHeadline) {
                    headlineHtml = `<p class="brief-field-cluster__headline">${exportModule.escapeHtml(b.clusterHeadline)}</p>`;
                  }
                  const subHead = introHtml || headlineHtml ? `${introHtml}${headlineHtml}` : "";
                  const gridMod = b.columns === 3 ? " brief-grid--3" : b.columns === 2 ? " brief-grid--2" : "";
                  const inner = b.fields.map((field) => `<div class="brief-block">${createFieldHtml(field)}</div>`).join("");
                  return `${subHead}<div class="brief-grid${gridMod}">${inner}</div>`;
                }).join("");
                pieces.push(`<div class="brief-field-cluster" role="group">${clusterBody}</div>`);
              } else {
                const gridMod = block.columns === 3 ? " brief-grid--3" : block.columns === 2 ? " brief-grid--2" : "";
                const inner = block.fields.map((field) => `<div class="brief-block">${createFieldHtml(field)}</div>`).join("");
                pieces.push(`<div class="brief-grid${gridMod}">${inner}</div>`);
                i++;
              }
            }
            return pieces.join("");
          };

          const sectionsHtml = config.sections.map((section) => {
            const blocksHtml = renderSectionBlocks(section.blocks);
            const intro = section.intro ? `<p class="brief-section__intro">${exportModule.escapeHtml(section.intro)}</p>` : "";
            return `
              <section class="brief-section" aria-labelledby="brief-sec-${section.id}">
                <h3 class="brief-section__title" id="brief-sec-${section.id}">${exportModule.escapeHtml(section.title)}</h3>
                ${intro}
                ${blocksHtml}
              </section>`;
          }).join("");

          wizardContentElement.innerHTML = `
            <h2 class="step-title">${exportModule.escapeHtml(config.title)}</h2>
            ${stepDescriptionHtml}
            <form class="brief-form" novalidate>
              ${sectionsHtml}
            </form>`;
          return;
        }

        wizardContentElement.innerHTML = `
          <h2 class="step-title">${exportModule.escapeHtml(config.title)}</h2>
          ${stepDescriptionHtml}
          <form class="form-grid">
            ${config.fields.map((field) => createFieldHtml(field)).join("")}
          </form>`;
      };

      const renderSummaryStep = () => {
        const state = stateStore.getData();
        const categoryConfig =
          state.category === "website"
            ? { sections: categorySchemaModule.getMergedWebsiteBriefSections() }
            : categorySchemaModule.categoryDetails[state.category];

        const detailsHtml = categoryConfig ? (() => {
          if (Array.isArray(categoryConfig.sections)) {
            return categoryConfig.sections.map((section) => {
              const fields = section.blocks.flatMap((block) => block.fields);
              const articles = fields.map((field) => `
            <article class="summary-item">
              <h4>${exportModule.escapeHtml(field.label)}</h4>
              <p>${exportModule.escapeHtml(exportModule.normalizeOutputText(state.details[field.name]))}</p>
            </article>`).join("");
              return `<h3 class="summary-section-title">${exportModule.escapeHtml(section.title)}</h3>${articles}`;
            }).join("");
          }
          if (Array.isArray(categoryConfig.fields)) {
            return categoryConfig.fields.map((field) => `
            <article class="summary-item">
              <h3>${field.label}</h3>
              <p>${exportModule.escapeHtml(exportModule.normalizeOutputText(state.details[field.name]))}</p>
            </article>`).join("");
          }
          return "<p>Детализация пока отсутствует.</p>";
        })() : "<p>Детализация пока отсутствует.</p>";

        wizardContentElement.innerHTML = `
          <h2 class="step-title">Финальная проверка</h2>
          <p class="step-description">
            Проверьте ответы перед отправкой. После успешной отправки владелец получит структурированный бриф и HTML-копию.
          </p>
          <div class="summary-list">
            <article class="summary-item">
              <h3>Контакты</h3>
              <p>Имя: ${exportModule.escapeHtml(exportModule.normalizeOutputText(state.contacts.clientName))}</p>
              <p>Компания: ${exportModule.escapeHtml(exportModule.normalizeOutputText(state.contacts.companyName))}</p>
              <p>Телефон: ${exportModule.escapeHtml(exportModule.normalizeOutputText(state.contacts.phone))}</p>
              <p>Email: ${exportModule.escapeHtml(exportModule.normalizeOutputText(state.contacts.email))}</p>
            </article>
            ${detailsHtml}
          </div>
          <p class="step-description summary-save-reminder">${exportModule.escapeHtml(
            "Нажмите «Отправить бриф», чтобы мы получили ответы автоматически. После обработки брифа мы отправим вам коммерческое предложение, в котором вы детально сможете рассмотреть смету по работе, начинку сайта и прочие детали разработки сайта."
          )}</p>
          <div class="summary-actions">
            <button id="saveReportButton" class="btn" type="button">Сохранить HTML-копию</button>
          </div>
          <p id="submissionStatus" class="submission-status" aria-live="polite"></p>
          <p class="help-text">Имя файла: Бриф [Компания] Веб-сайт [ММ.ГГ].html</p>`;
      };

      const syncStepMeta = () => {
        const currentIndex = stateStore.getCurrentIndex();
        const totalSteps = stateStore.getTotalSteps();
        const stepNumber = currentIndex + 1;
        const percent = Math.round((stepNumber / totalSteps) * 100);

        stepCounterElement.textContent = `Шаг ${stepNumber}`;
        progressTextElement.textContent = `Шаг ${stepNumber} из ${totalSteps}`;
        progressPercentElement.textContent = `${percent}%`;
        progressValueElement.style.width = `${percent}%`;
        progressBarElement.setAttribute("aria-valuenow", String(percent));

        prevButton.disabled = currentIndex === 0;
        nextButton.textContent = stateStore.getCurrentStep() === "summary" ? "Отправить бриф" : "Далее";
      };

      const collectCurrentInputs = () => {
        const currentStep = stateStore.getCurrentStep();
        clearErrors();

        if (currentStep === "contacts") {
          ["clientName", "companyName", "phone", "email"].forEach((fieldName) => {
            const input = wizardContentElement.querySelector(`[name="${fieldName}"]`);
            stateStore.updateField("contacts", fieldName, input ? input.value : "");
          });
          errors = validationModule.validateContacts(stateStore.getData().contacts);
          return Object.keys(errors).length === 0;
        }

        if (categorySchemaModule.categoryDetails[currentStep]) {
          const fields = categorySchemaModule.getFlatFields(currentStep);
          fields.forEach((field) => {
            if (field.type === "checkbox") {
              const checked = Array.from(wizardContentElement.querySelectorAll(`[name="${field.name}"]:checked`)).map((node) => node.value);
              stateStore.updateField("details", field.name, checked);
            } else if (field.type === "radio") {
              const selected = wizardContentElement.querySelector(`[name="${field.name}"]:checked`);
              stateStore.updateField("details", field.name, selected ? selected.value : "");
            } else {
              const input = wizardContentElement.querySelector(`[name="${field.name}"]`);
              stateStore.updateField("details", field.name, input ? input.value : "");
            }
          });
          errors = validationModule.validateDetailStep(currentStep, stateStore.getData().details);
          return Object.keys(errors).length === 0;
        }

        return true;
      };

      const applyErrors = () => {
        Object.entries(errors).forEach(([fieldName, message]) => {
          writeError(fieldName, message);
        });
      };

      const setSubmissionStatus = (message, statusType) => {
        const statusElement = document.getElementById("submissionStatus");
        if (!statusElement) {
          return;
        }
        statusElement.textContent = message || "";
        statusElement.className = "submission-status";
        if (statusType) {
          statusElement.classList.add(`submission-status--${statusType}`);
        }
      };

      const renderCurrentStep = () => {
        const step = stateStore.getCurrentStep();
        if (step === "contacts") {
          renderContactsStep();
        } else if (step === "summary") {
          renderSummaryStep();
        } else {
          renderDetailStep(step);
        }
        fillFieldsFromState();
        syncStepMeta();
        const reduceMotion =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const scrollBehavior = reduceMotion ? "auto" : "smooth";
        requestAnimationFrame(() => {
          try {
            window.scrollTo({ top: 0, left: 0, behavior: scrollBehavior });
          } catch (err) {
            window.scrollTo(0, 0);
          }
        });
      };

      const bindActions = () => {
        nextButton.addEventListener("click", async () => {
          if (stateStore.getCurrentStep() === "summary") {
            setSubmissionStatus("Отправляем бриф. Пожалуйста, не закрывайте страницу...", "");
            nextButton.disabled = true;
            prevButton.disabled = true;
            try {
              await briefDeliveryModule.sendBrief(stateStore.getData());
              setSubmissionStatus("Бриф успешно отправлен. Спасибо, мы скоро свяжемся с вами.", "success");
            } catch (err) {
              setSubmissionStatus(err && err.message ? err.message : "Не удалось отправить бриф. Попробуйте ещё раз.", "error");
            } finally {
              nextButton.disabled = false;
              prevButton.disabled = false;
              syncStepMeta();
            }
            return;
          }
          const valid = collectCurrentInputs();
          if (!valid) {
            applyErrors();
            return;
          }
          stateStore.goNext();
          renderCurrentStep();
        });

        prevButton.addEventListener("click", () => {
          stateStore.goPrev();
          renderCurrentStep();
        });

        wizardContentElement.addEventListener("click", (event) => {
          const saveButton = event.target.closest("#saveReportButton");
          if (!saveButton) {
            return;
          }
          exportModule.saveReport(stateStore.getData());
          setSubmissionStatus("HTML-копия сохранена на устройстве. Автоматическая отправка выполняется кнопкой «Отправить бриф».", "");
        });
      };

      const init = () => {
        if (!wizardContentElement || !nextButton || !prevButton) {
          return;
        }
        try {
          renderCurrentStep();
          bindActions();
        } catch (err) {
          wizardContentElement.innerHTML =
            "<p class=\"step-description\">Не удалось запустить бриф в этом окне браузера. Сохраните файл и откройте его в Safari, Chrome или Edge (не во встроенном просмотрщике чата), либо обновите систему.</p>";
        }
      };

      return { init };
    })();

    /**
     * Точка входа приложения.
     */
    document.addEventListener("DOMContentLoaded", () => {
      try {
        tooltipModule.bindEvents();
      } catch (err) {
        /* подсказки необязательны */
      }
      wizardNavigationModule.init();
    });
  </script>
</body>
</html>
